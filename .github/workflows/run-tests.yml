name: Automation-Tests
run-name: ${{ github.actor }} is running automation tests 🚀
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  Run-Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: install dependencies
        run: npm ci
      - name: build app
        run: npm run build
      - name: Type-check dashboard application
        run: npm run typecheck --workspace=@weather/weather-dashboard
      - name: lint
        run: npm run lint
      - name: run tests
        run: npm run test:coverage
      - name: Install pinned browser verification tooling
        run: |
          npm install --prefix .tools/browser-tooling --no-save --package-lock=false playwright@1.64.1
          .tools/browser-tooling/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify storm journeys on Chromium and WebKit
        env:
          WEATHER_PLAYWRIGHT_PATH: ${{ github.workspace }}/.tools/browser-tooling/node_modules/playwright
        run: node scripts/verify-storm-browser.cjs --workers=1
